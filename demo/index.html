<!DOCTYPE html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Small Talk Warm-up: demo</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700&display=swap">
<style>
:root{--canvas:#ECEDF0;--surface:#FFFFFF;--border:#F0F1F3;--ink:#1C1C1E;--muted:#66666C;--coral:#E8747A;--coral-strong:#CC4650;--coral-text:#BE3B45;--glass:rgba(28,28,30,0.64);--fill:#ECEDF0;--disabled:#E5E5EA;--icon-disabled:#AEAEB2;--fallback:#8E8E93;--shadow:0 8px 24px rgba(28,28,30,0.06)}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:var(--canvas);font-family:'Outfit',system-ui,-apple-system,'Segoe UI',sans-serif;color:var(--ink);-webkit-font-smoothing:antialiased;-webkit-tap-highlight-color:transparent;font-size:16px;line-height:1.4}
button,input,textarea{font-family:inherit}
button{cursor:pointer;-webkit-appearance:none;appearance:none;margin:0}
button:disabled{cursor:default}
h1,h2,p{margin:0}
:focus-visible{outline:3px solid var(--ink);outline-offset:2px}
.onphoto :focus-visible,.onphoto:focus-visible{outline-color:#FFFFFF}
h1:focus{outline:none}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
#frame{position:relative;width:100%;max-width:480px;height:100vh;height:100dvh;margin:0 auto;background:var(--surface);overflow:hidden}
@media (min-width:560px) and (min-height:620px){
body{display:flex;align-items:center;justify-content:center}
#frame{width:390px;height:min(844px,calc(100dvh - 40px));border-radius:40px;box-shadow:0 24px 60px rgba(28,28,30,0.12)}
}
#app{position:absolute;inset:0}
.screen{position:absolute;inset:0;display:flex;flex-direction:column;background:var(--surface)}
.scroll{overflow-y:auto;-webkit-overflow-scrolling:touch}
.muted{color:var(--muted)}
.label{font-size:13px;font-weight:700;color:var(--muted)}

/* buttons */
.btn{width:100%;height:56px;border-radius:28px;font-size:17px;font-weight:700;display:flex;align-items:center;justify-content:center;gap:8px;flex:none}
.btn-primary{border:0;background:var(--coral-strong);color:#FFFFFF;box-shadow:0 8px 20px rgba(204,70,80,0.24)}
.btn-primary:disabled{background:var(--disabled);color:#77777D;box-shadow:none}
.btn-secondary{border:2px solid var(--coral-strong);background:#FFFFFF;color:var(--coral-strong)}
.btn-text{height:44px;border:0;background:transparent;color:var(--ink);font-size:16px;font-weight:500}
.btn-sm{height:48px;border-radius:24px}
.iconbtn{width:44px;height:44px;flex:none;border-radius:50%;border:1px solid var(--border);background:#FFFFFF;color:var(--ink);display:flex;align-items:center;justify-content:center;padding:0;box-shadow:var(--shadow)}
.glassbtn{width:44px;height:44px;flex:none;border-radius:50%;border:0;background:var(--glass);-webkit-backdrop-filter:blur(20px) saturate(1.3);backdrop-filter:blur(20px) saturate(1.3);color:#FFFFFF;display:flex;align-items:center;justify-content:center;padding:0}
.pills{display:flex;gap:8px}
.pill{flex:1;min-width:0;height:48px;border-radius:24px;border:0;background:var(--fill);color:var(--ink);font-size:16px;font-weight:500;padding:0 6px}
.pill[aria-pressed="true"]{background:var(--coral-strong);color:#FFFFFF;font-weight:700}
.field{display:flex;flex-direction:column;gap:8px}
.input{height:48px;padding:0 16px;border-radius:24px;border:1px solid #C7C7CC;background:#FFFFFF;font-size:16px;color:var(--ink);width:100%}
.card{padding:16px 18px;border-radius:24px;background:#FFFFFF;border:1px solid var(--border);box-shadow:var(--shadow);display:flex;flex-direction:column;gap:10px}
.stack2{display:flex;flex-direction:column;gap:2px}

/* photo pieces */
.photo{position:relative;overflow:hidden;background:var(--fallback)}
.photo>img.bg{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.shade{position:absolute;left:0;right:0;bottom:0;height:60%;background:linear-gradient(180deg,rgba(0,0,0,0) 0%,rgba(0,0,0,0.6) 45%,rgba(0,0,0,0.6) 100%)}
.who{display:flex;align-items:center;gap:10px;padding:5px 16px 5px 5px;border-radius:28px;background:var(--glass);-webkit-backdrop-filter:blur(20px) saturate(1.3);backdrop-filter:blur(20px) saturate(1.3);color:#FFFFFF}
.who img{width:38px;height:38px;border-radius:50%;object-fit:cover}
.who b{display:block;font-size:16px;font-weight:700;line-height:1.15}
.who span{display:block;font-size:13px;line-height:1.2}
@keyframes stwDrift{from{transform:scale(1.04) translate3d(0,0,0)}to{transform:scale(1.12) translate3d(-1.5%,-1%,0)}}
.drift{animation:stwDrift 24s ease-in-out infinite alternate}
@keyframes stwPulse{0%,100%{opacity:1}50%{opacity:.35}}
@keyframes stwRing{0%,100%{box-shadow:0 0 0 8px rgba(232,116,122,0.38),0 0 0 18px rgba(232,116,122,0.18)}50%{box-shadow:0 0 0 11px rgba(232,116,122,0.38),0 0 0 24px rgba(232,116,122,0.18)}}
@media (prefers-reduced-motion:reduce){.drift,.pulse,.main.rec,.skel{animation:none!important}}

/* first run */
.fr-hero{flex:0 0 38%;min-height:200px;border-radius:0 0 32px 32px}
.fr-hero .txt{position:absolute;left:20px;right:20px;bottom:22px;color:#FFFFFF;display:flex;flex-direction:column;gap:4px}
.fr-hero h1,.db-hero h1{font-size:28px;font-weight:700;line-height:1.2;color:#FFFFFF}
.fr-body{flex:1;min-height:0;padding:20px 20px 28px;display:flex;flex-direction:column;gap:16px}
.fr-points{display:flex;flex-direction:column;gap:14px}
.fr-points b{font-size:16px;font-weight:700}
.fr-points span{font-size:14px;color:var(--muted)}

/* picker */
.picker{padding-top:24px;gap:16px}
.phead{display:flex;justify-content:space-between;align-items:flex-start;padding:0 20px;gap:12px;flex:none}
.phead h1{font-size:28px;font-weight:700;line-height:1.2}
.carousel{--cardw:min(310px,calc(100% - 80px));flex:1;min-height:220px;display:flex;gap:12px;padding:0 20px;overflow-x:auto;scroll-snap-type:x mandatory;scroll-padding-left:20px;scrollbar-width:none}
.carousel::-webkit-scrollbar{display:none}
.carousel::after{content:"";flex:none;width:calc(100% - var(--cardw) - 52px)}
.scard{position:relative;flex:none;width:var(--cardw);height:100%;border-radius:28px;overflow:hidden;background:var(--fallback);box-shadow:var(--shadow);border:0;padding:0;text-align:left;scroll-snap-align:start;color:#FFFFFF}
.scard img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.scard .count{position:absolute;top:12px;left:12px;height:30px;padding:0 14px 0 12px;border-radius:15px;background:var(--glass);-webkit-backdrop-filter:blur(20px) saturate(1.3);backdrop-filter:blur(20px) saturate(1.3);font-size:13px;font-weight:600;display:flex;align-items:center}
.scard .txt{position:absolute;left:20px;right:20px;bottom:20px;display:flex;flex-direction:column;gap:6px}
.scard .t{font-size:24px;font-weight:700;line-height:1.15}
.scard .l{font-size:16px;line-height:1.35}
.dots{display:flex;justify-content:center;gap:6px;flex:none}
.dots span{width:8px;height:8px;border-radius:4px;background:#C7C7CC;transition:width .2s}
.dots span.on{width:20px;background:var(--ink)}
.plen{display:flex;flex-direction:column;gap:8px;padding:4px 20px 0;flex:none}
.pcta{padding:4px 20px 24px;flex:none}

/* chat */
.stage{position:relative;flex:1;min-height:0}
.stage .photo{position:absolute;inset:0 0 44px 0;border-radius:0 0 32px 32px}
.stage .shade{height:62%;background:linear-gradient(180deg,rgba(0,0,0,0) 0%,rgba(0,0,0,0.6) 30%,rgba(0,0,0,0.6) 100%)}
.chead{position:absolute;top:16px;left:12px;right:12px;display:flex;justify-content:space-between;align-items:center}
.cap{position:absolute;left:20px;right:20px;bottom:62px;display:flex;flex-direction:column;gap:12px;max-height:calc(100% - 150px);overflow-y:auto;scrollbar-width:none;color:#FFFFFF}
.cap::-webkit-scrollbar{display:none}
.strow{display:flex;align-items:center;gap:10px;flex:none}
.st{height:30px;padding:0 14px;border-radius:15px;font-size:13px;font-weight:700;display:flex;align-items:center;gap:8px;color:#FFFFFF}
.st-coral{background:var(--coral-strong)}
.st-glass{background:var(--glass);-webkit-backdrop-filter:blur(20px) saturate(1.3);backdrop-filter:blur(20px) saturate(1.3);font-weight:600;padding-left:12px}
.st .dot{width:8px;height:8px;border-radius:50%;background:var(--coral)}
.pulse{animation:stwPulse 1.2s ease-in-out infinite}
.say{font-size:20px;font-weight:400;line-height:1.38}
.say.small{font-size:16px}
.note{font-size:14px;line-height:1.4}
.hint{align-self:flex-start;min-height:44px;padding:8px 16px;border-radius:22px;background:var(--glass);-webkit-backdrop-filter:blur(20px) saturate(1.3);backdrop-filter:blur(20px) saturate(1.3);font-size:16px;display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.hint b{font-weight:700}
.panel{padding:12px 16px 14px;border-radius:20px;background:var(--glass);-webkit-backdrop-filter:blur(20px) saturate(1.3);backdrop-filter:blur(20px) saturate(1.3);display:flex;flex-direction:column;gap:4px;flex:none}
.panel .pl{font-size:13px;font-weight:700}
.panel .pt{font-size:18px;line-height:1.4;min-height:25px;overflow-wrap:anywhere}
.panel .pt .part{opacity:.7}
.panel textarea{width:100%;margin:0;padding:0;border:0;background:transparent;resize:none;font-size:18px;line-height:1.4;color:#FFFFFF;outline:none}
.panel textarea::placeholder{color:rgba(255,255,255,0.75)}
.errbtns{display:flex;gap:8px;flex-wrap:wrap}
.gbtn{min-height:44px;padding:0 18px;border-radius:22px;border:0;background:#FFFFFF;color:var(--ink);font-size:16px;font-weight:700}
.gbtn.alt{background:var(--glass);color:#FFFFFF;-webkit-backdrop-filter:blur(20px) saturate(1.3);backdrop-filter:blur(20px) saturate(1.3)}
.controls{position:absolute;left:0;right:0;bottom:0;display:grid;grid-template-columns:1fr 190px 1fr;align-items:center}
.main{justify-self:center;width:88px;height:88px;border-radius:50%;border:5px solid #FFFFFF;display:flex;align-items:center;justify-content:center;padding:0;background:var(--coral-strong);color:#FFFFFF;box-shadow:0 8px 20px rgba(204,70,80,0.28)}
.main:disabled{background:var(--disabled);color:var(--icon-disabled);box-shadow:none}
.main.rec{animation:stwRing 1.6s ease-in-out infinite;box-shadow:0 0 0 8px rgba(232,116,122,0.38),0 0 0 18px rgba(232,116,122,0.18)}
.sec{width:56px;height:56px;border-radius:50%;border:2px solid var(--coral-strong);background:#FFFFFF;color:var(--coral-strong);display:flex;align-items:center;justify-content:center;padding:0;box-shadow:0 0 0 4px #FFFFFF,0 8px 20px rgba(28,28,30,0.10)}
.sec:disabled{border-color:var(--icon-disabled);color:var(--icon-disabled);box-shadow:0 0 0 4px #FFFFFF}
.sec.l{justify-self:end}.sec.r{justify-self:start}
.labels{flex:none;display:grid;grid-template-columns:1fr 190px 1fr;align-items:center;padding:8px 0 22px;min-height:50px}
.labels .c{text-align:center;font-size:16px;font-weight:700}
.labels .s{width:56px;text-align:center;font-size:13px;color:var(--muted)}
.labels .s.l{justify-self:end}.labels .s.r{justify-self:start}

/* sheets */
#sheet{position:absolute;inset:0;z-index:10;display:none}
#sheet.open{display:block}
.scrim{position:absolute;inset:0;background:rgba(28,28,30,0.45);border:0;padding:0;width:100%;height:100%;cursor:default}
.sheet{position:absolute;left:0;right:0;bottom:0;max-height:92%;overflow-y:auto;padding:10px 20px 28px;border-radius:28px 28px 0 0;background:#FFFFFF;display:flex;flex-direction:column;gap:18px;box-shadow:0 -8px 24px rgba(28,28,30,0.08)}
.grab{align-self:center;width:36px;height:4px;border-radius:2px;background:#D1D1D6;flex:none}
.shead{display:flex;justify-content:space-between;align-items:center}
.shead h2{font-size:22px;font-weight:700}
.row{display:flex;align-items:center;gap:16px}
.row .rt{flex:1;display:flex;flex-direction:column;gap:3px}
.row .rt b{font-size:16px;font-weight:700}
.row .rt span{font-size:14px;color:var(--muted)}
.switch{flex:none;width:56px;height:44px;border:0;background:transparent;padding:6px 0;display:flex}
.switch span{width:56px;height:32px;border-radius:16px;background:#8E8E93;padding:3px;display:flex;justify-content:flex-start}
.switch span i{width:26px;height:26px;border-radius:50%;background:#FFFFFF;display:block}
.switch[aria-checked="true"] span{background:var(--coral-strong);justify-content:flex-end}
.copybox{width:100%;height:220px;border:1px solid #C7C7CC;border-radius:16px;padding:12px;font-size:14px;line-height:1.4;color:var(--ink);resize:none}

/* debrief, history */
.db-hero{flex:none;height:230px;border-radius:0 0 32px 32px}
.db-hero img.bg{filter:blur(14px);transform:scale(1.2)}
.db-hero .dim{position:absolute;inset:0;background:rgba(0,0,0,0.6)}
.db-hero .txt{position:absolute;left:20px;right:20px;bottom:22px;color:#FFFFFF;display:flex;flex-direction:column;gap:4px}
.db-body{padding:16px 16px 28px;display:flex;flex-direction:column;gap:12px}
.big{font-size:18px;font-weight:700;line-height:1.35}
.sm{font-size:14px;line-height:1.4;color:var(--muted)}
.xs{font-size:13px;line-height:1.4;color:var(--muted)}
.skel{height:14px;border-radius:7px;background:var(--fill);animation:stwPulse 1.2s ease-in-out infinite}
.hist{padding:24px 16px 28px;gap:16px}
.hhead{display:flex;align-items:center;gap:12px;flex:none}
.hhead h1{font-size:24px;font-weight:700;line-height:1.2}
.hrow{width:100%;display:flex;align-items:center;gap:12px;padding:10px 14px 10px 10px;border-radius:24px;border:1px solid var(--border);background:#FFFFFF;box-shadow:var(--shadow);text-align:left;color:var(--ink)}
.hrow img{width:56px;height:56px;border-radius:16px;object-fit:cover;object-position:50% 30%;flex:none;background:var(--fallback)}
.hrow .ht{flex:1;min-width:0;display:flex;flex-direction:column;gap:3px}
.hrow .ht b{font-size:16px;font-weight:700}
.hrow .ht span{font-size:14px;color:var(--muted)}
.hlist{display:flex;flex-direction:column;gap:10px}
.turn{display:flex;flex-direction:column;gap:2px}
.turn .tx{font-size:16px;line-height:1.45;overflow-wrap:anywhere}
.vbanner{margin:0 20px;padding:10px 14px;border-radius:16px;background:var(--fill);font-size:13px;line-height:1.4;color:var(--ink);flex:none}
.fr-body .vbanner{margin:0}
.toast{position:absolute;left:50%;bottom:24px;transform:translateX(-50%);z-index:20;background:var(--ink);color:#FFFFFF;font-size:14px;font-weight:500;padding:10px 16px;border-radius:20px;max-width:86%;text-align:center}
#frame{display:flex;flex-direction:column}
#app{position:relative;flex:1;min-height:0;inset:auto}
.demobar{flex:none;background:var(--ink);color:#FFFFFF;font-size:13px;line-height:1.35;padding:8px 16px;text-align:center}
.demobar b{font-weight:700}
.persona{padding:14px 16px;border-radius:20px;background:var(--fill);display:flex;flex-direction:column;gap:4px}
.persona b{font-size:16px}
.persona span{font-size:14px;color:var(--ink)}
.scard.locked .count{background:rgba(28,28,30,0.78)}
.pill:disabled{color:#77777D;background:#F4F4F6}
.opts{display:flex;flex-direction:column;gap:8px;flex:none}
.opt{width:100%;min-height:48px;padding:11px 16px;border-radius:18px;border:0;background:rgba(255,255,255,0.94);color:var(--ink);font-size:16px;line-height:1.35;text-align:left}
.optlab{font-size:13px;font-weight:600}
.endcard{background:var(--fill);border:0;box-shadow:none}
</style>
</head>
<body>
<div id="frame">
<div class="demobar" role="note"><b>Demo mode.</b> Claire’s replies are scripted. In the live app, Claude writes every reply.</div>
<main id="app"></main>
<div id="sheet"></div>
<div id="toast" class="toast" role="status" hidden></div>
<div id="live" class="sr" aria-live="polite"></div>
</div>

  return '<section class="screen picker">' +

  '<div class="carousel" id="carousel" role="group" aria-label="Scenes">' + cards + '</div>' +

  '<div class="pcta"><button type="button" class="btn btn-primary" data-act="start">Start chat</button></div>' +
  '</section>';
};
function placeCarousel(i, smooth){
  var car = $('#carousel'); if (!car) return;
  var card = car.children[i]; if (!card) return;
  var left = card.offsetLeft - 20;
  try { car.scrollTo({left:left, behavior: smooth ? 'smooth' : 'auto'}); } catch (e) { car.scrollLeft = left; }
}
function markScene(){
  var car = $('#carousel'); if (!car) return;
  Array.prototype.forEach.call(car.querySelectorAll('.scard'), function(b){ b.setAttribute('aria-pressed', String(b.getAttribute('data-scene') === ui.scene)); });
  var d = $('#dots'); if (d) Array.prototype.forEach.call(d.children, function(x, i){ x.className = ORDER[i] === ui.scene ? 'on' : ''; });
}
var scrollLock = 0;
AFTER.picker = function(){
  var car = $('#carousel');
  placeCarousel(ORDER.indexOf(ui.scene));
  var raf = 0;
  car.addEventListener('scroll', function(){
    if (Date.now() < scrollLock) return;
    cancelAnimationFrame(raf);
    raf = requestAnimationFrame(function(){
      var best = 0, bd = 1e9;
      Array.prototype.forEach.call(car.querySelectorAll('.scard'), function(b, i){ var dd = Math.abs(b.offsetLeft - 20 - car.scrollLeft); if (dd < bd) { bd = dd; best = i; } });
      if (ORDER[best] !== ui.scene) { ui.scene = ORDER[best]; markScene(); }
    });
  }, {passive:true});
};

/* ---------- voice (optional, browser only) ---------- */
var speakToken = 0;
function pickVoice(){
  try {
    var vs = window.speechSynthesis.getVoices() || [];
    var gb = vs.filter(function(v){ return /^en[-_]GB/i.test(v.lang); });
    return gb.filter(function(v){ return /female|martha|kate|serena|sonia|libby|stephanie|hazel|susan/i.test(v.name); })[0] || gb[0] || vs.filter(function(v){ return /^en/i.test(v.lang); })[0] || null;
  } catch (e) { return null; }
}
function speak(text){
  var my = ++speakToken;
  var readTime = Math.min(5200, 1400 + text.length * 32);
  if (!ui.voiceOn || !('speechSynthesis' in window)) return wait(readTime);
  return new Promise(function(res){
    var done = false, fin = function(){ if (!done) { done = true; clearTimeout(t); res(); } };
    var t = setTimeout(fin, Math.min(30000, 3000 + text.length * 95));
    try {
      var u = new SpeechSynthesisUtterance(text); u.lang = 'en-GB'; u.rate = 1;
      var v = pickVoice(); if (v) u.voice = v;
      u.onend = fin; u.onerror = fin;
      window.speechSynthesis.cancel(); window.speechSynthesis.speak(u);
    } catch (e) { fin(); }
  }).then(function(){ if (my !== speakToken) return; });
}
function stopSpeak(){ speakToken++; try { if ('speechSynthesis' in window) window.speechSynthesis.cancel(); } catch (e) {} }

/* ---------- chat engine ---------- */
function startChat(){
  stopSpeak();
  chat = {i:0, picks:[], turns:[], state:'thinking', hintVisible:false, hintTimer:null, draft:null, elapsed:0, lastTick:performance.now(), closed:false, tick:null, firstCheck:true};
  ui.screen = 'chat'; closeSheet(true); render();
  chat.tick = setInterval(function(){ var c = chat; if (!c || c.closed) return; var now = performance.now(); if (!ui.sheet && !document.hidden) c.elapsed += Math.min(1000, now - c.lastTick); c.lastTick = now; }, 250);
  wait(700).then(function(){ if (chat && !chat.closed) claireSays(TURNS[0].claire, false); });
}
function claireSays(text, ending){
  var c = chat;
  c.turns.push({who:'claire', text:text});
  c.ending = ending; c.hintVisible = false;
  setState('speaking');
  speak(text).then(function(){
    if (c !== chat || c.closed || c.state !== 'speaking') return;
    if (ending) { wait(600).then(function(){ if (c === chat && !c.closed) finishChat('claire'); }); return; }
    setState('yourturn'); armHint();
  });
}
function armHint(){
  var c = chat; clearHint();
  if (!ui.hints) return;
  c.hintTimer = setTimeout(function(){ if (c === chat && c.state === 'yourturn') { c.hintVisible = true; paintChat(); say('Hint. ' + TURNS[c.i].hint); } }, 8000);
}
function clearHint(){ if (chat && chat.hintTimer) { clearTimeout(chat.hintTimer); chat.hintTimer = null; } }
function setState(s){ if (!chat) return; chat.state = s; paintChat(); }
function choose(k){
  var c = chat; if (!c || c.state !== 'yourturn') return;
  clearHint();
  var o = TURNS[c.i].opts.filter(function(x){ return x.k === k; })[0];
  c.draft = {opt:o, raw:o.raw || o.text, hint:c.hintVisible};
  setState('check');
}
function sendReply(){
  var c = chat; if (!c || c.state !== 'check') return;
  var ta = $('#reply'); var text = norm(ta ? ta.value : '');
  if (!text) { if (ta) ta.focus(); return; }
  var d = c.draft;
  var t = {who:'you', text:text, raw:d.raw, edited:norm(d.raw).toLowerCase() !== text.toLowerCase(), hint:d.hint, k:d.opt.k, turn:c.i};
  c.turns.push(t); c.picks.push({turn:c.i, opt:d.opt, sent:text});
  c.draft = null; c.firstCheck = false;
  setState('thinking');
  var react = d.opt.react, next = c.i + 1;
  wait(900).then(function(){
    if (c !== chat || c.closed) return;
    if (next < TURNS.length) { c.i = next; claireSays(react + ' ' + TURNS[next].claire, false); }
    else claireSays(react + ' ' + EXIT, true);
  });
}
function teardown(){ var c = chat; if (!c) return; c.closed = true; clearHint(); clearInterval(c.tick); stopSpeak(); }
function finishChat(reason){
  var c = chat; if (!c) return;
  teardown();
  if (!c.picks.length) { chat = null; go('picker'); toast('Nothing to review yet.'); return; }
  session = {endedBy:reason, turns:c.turns, picks:c.picks, activeSec:Math.round(c.elapsed / 1000), at:Date.now()};
  session.debrief = buildDebrief(session);
  session.note = buildNote(session);
  chat = null;
  go('debrief');
}

/* ---------- chat screen ---------- */
SCREENS.chat = function(){
  var s = SCENES.lift;
  return '<section class="screen chat"><h1 class="sr">Chat with Claire, hotel lift</h1>' +
  '<div class="stage"><div class="photo"><img class="bg drift" src="' + s.img + '" alt="' + esc(s.alt) + '" style="object-position:' + s.pos + '"><div class="shade"></div>' +
  '<div class="chead onphoto">' + whoChip() + '<button type="button" class="glassbtn" data-act="end" aria-label="End chat">' + svg(P.x, 20) + '</button></div>' +
  '<div class="cap onphoto" id="cap"></div></div>' +
  '<div class="controls" id="controls"></div></div>' +
  '<div class="labels" id="labels"></div></section>';
};
AFTER.chat = function(){ paintChat(); };
function lastOf(who){ for (var i = chat.turns.length - 1; i >= 0; i--) if (chat.turns[i].who === who) return chat.turns[i]; return null; }
function paintChat(){
  var c = chat; if (!c || ui.screen !== 'chat') return;
  var cap = $('#cap'), ctr = $('#controls'), lab = $('#labels'); if (!cap) return;
  var st = c.state, cl = lastOf('claire'), you = lastOf('you');
  var pill = function(text, coral, pulse){ return '<div class="strow"><div class="st ' + (coral ? 'st-coral' : 'st-glass') + '" role="status">' + (coral ? '' : '<span class="dot' + (pulse ? ' pulse' : '') + '"></span>') + text + '</div></div>'; };
  var line = function(small){ return cl ? '<p class="say' + (small ? ' small' : '') + '">' + esc(cl.text) + '</p>' : ''; };
  var h = '', left = '<div></div>', main = '', lc = '', ll = '';
  var micOff = '<button type="button" class="main" disabled aria-label="Reply, unavailable">' + svg(P.mic, 34, 2.2) + '</button>';
  if (st === 'thinking') {
    h = pill('Claire is thinking', false, true) + (you && c.turns[c.turns.length - 1] === you ? '<div class="panel"><div class="pl">You</div><div class="pt">' + esc(you.text) + '</div></div>' : '');
    main = micOff; lc = 'One moment';
  } else if (st === 'speaking') {
    h = pill('Claire is speaking', false, false) + line(false);
    main = micOff; lc = 'Claire is speaking';
  } else if (st === 'yourturn') {
    var T = TURNS[c.i];
    h = pill('Your turn', true) + line(true) +
      '<div class="optlab">Choose what Lucía says. In the live app, she speaks or types.</div>' +
      '<div class="opts" role="group" aria-label="Replies">' + T.opts.map(function(o){ return '<button type="button" class="opt" data-act="choose" data-k="' + o.k + '">' + esc(o.text) + '</button>'; }).join('') + '</div>' +
      (c.hintVisible ? '<div class="hint"><b>Hint</b><span>' + esc(T.hint) + '</span></div>' : '');
    main = ''; lc = 'Choose a reply';
  } else if (st === 'check') {
    h = pill('Check your reply', true) + line(true) +
      (c.firstCheck ? '<div class="note">In the live app, this is what the microphone heard. Fix anything it got wrong, then send.</div>' : '') +
      '<div class="panel"><label class="pl" for="reply">You said. Tap to edit.</label><textarea id="reply" rows="2" maxlength="300" autocapitalize="sentences">' + esc(c.draft.raw) + '</textarea></div>';
    left = '<button type="button" class="sec l" data-act="back" aria-label="Choose again">' + svg(P.back, 24) + '</button>'; ll = 'Back';
    main = '<button type="button" class="main" data-act="send" aria-label="Send">' + svg(P.send, 34, 2.4) + '</button>'; lc = 'Send to Claire';
  }
  cap.innerHTML = h;
  ctr.innerHTML = left + (main || '<div></div>') + '<div></div>';
  lab.innerHTML = '<div class="s l">' + ll + '</div><div class="c">' + lc + '</div><div class="s r"></div>';
  if (st === 'check') {
    var ta = $('#reply');
    var grow = function(){ ta.style.height = 'auto'; ta.style.height = Math.min(ta.scrollHeight, 132) + 'px'; };
    ta.addEventListener('input', grow); grow();
    ta.addEventListener('keydown', function(e){ if (e.key === 'Enter' && !e.shiftKey && !e.isComposing) { e.preventDefault(); sendReply(); } });
  }
  cap.scrollTop = cap.scrollHeight;
}

/* ---------- debrief logic (stands in for the Claude debrief call) ---------- */
function buildDebrief(s){
  var picks = s.picks, d = {phrases:[], correction:null, followUps:[], nextTime:''};
  picks.forEach(function(p){ if (p.opt.k === 'a' && p.opt.fu && letters(p.sent).indexOf(letters(p.opt.fu)) > -1) d.followUps.push(p.opt.fu); });
  var mine = null;
  [2, 3, 1, 0].some(function(ti){ var p = picks.filter(function(x){ return x.turn === ti && x.opt.phrase; })[0]; if (p && letters(p.sent).indexOf(letters(p.opt.phrase.text).slice(0, 14)) > -1) { mine = p.opt.phrase; return true; } return false; });
  d.phrases = mine ? [{text:mine.text, source:'you', why:mine.why}, CLAIRE_PHRASES[0]] : CLAIRE_PHRASES.slice();
  var errPick = picks.filter(function(p){ return p.opt.err && p.opt.err.re.test(p.sent); })[0];
  if (errPick) d.correction = {youSaid:errPick.sent, trySaying:errPick.opt.err.fix, why:errPick.opt.err.why};
  else {
    var nat = picks.filter(function(p){ return p.opt.natural; })[0];
    if (nat) d.correction = {youSaid:nat.sent, trySaying:nat.opt.natural.fix, why:nat.opt.natural.why};
    else d.correction = {youSaid:picks[0].sent, trySaying:'Yes, me too. Did you manage to sleep?', why:'No mistakes this time. “Manage to” shows you guessed it was a hard night.'};
  }
  var missed = picks.filter(function(p){ return TURNS[p.turn].shared && p.opt.k !== 'a'; })[0];
  if (missed) d.nextTime = 'When Claire mentioned ' + TURNS[missed.turn].topic + ', you could ask: “' + TURNS[missed.turn].ask + '”';
  else if (d.followUps.length >= 3) d.nextTime = 'Ask a second question on the same topic, for example: “Is it a big match for him?”';
  else d.nextTime = 'When Claire shares some news, react first, then ask one question about it.';
  return d;
}
function buildNote(s){
  var picks = s.picks, n = picks.length;
  var a = s.debrief.followUps.length;
  var errs = picks.filter(function(p){ return p.opt.err && p.opt.err.re.test(p.sent); }).map(function(p){ return p.opt.err.label; });
  var closedNews = picks.filter(function(p){ return TURNS[p.turn].shared && p.opt.k !== 'a'; }).length;
  var hints = s.turns.filter(function(t){ return t.who === 'you' && t.hint; }).length;
  var edits = s.turns.filter(function(t){ return t.who === 'you' && t.edited; }).length;
  var first = a + ' follow-up question' + (a === 1 ? '' : 's') + ' in ' + n + ' turn' + (n === 1 ? '' : 's') + '.';
  if (closedNews) first += ' When Claire shared news, Lucía answered without asking back, so Claire carried the chat.';
  if (errs.length) first += ' Accuracy slipped under pressure: ' + errs.join('; ') + '.';
  if (hints) first += ' Waited for the hint on ' + hints + ' turn' + (hints === 1 ? '' : 's') + '.';
  if (edits) first += ' Fixed the speech transcript before sending on ' + edits + ' turn' + (edits === 1 ? '' : 's') + '.';
  var second = a <= 1 ? 'In class: drill “react, then ask” with news cards (Oh no! Did you…? / How exciting! What…?).' : (errs.length ? 'In class: a two-minute review of ' + errs[0].split(' (')[0] + ', then repeat this scene.' : 'In class: move on to second follow-up questions on the same topic.');
  return first + ' ' + second;
}

  '</div></section>';

function debriefCards(d){
  var q = function(t){ return '“' + esc(String(t).replace(/^["“]|["”]$/g, '')) + '”'; };
  var h = '<div class="card"><div class="label">Two phrases worth reusing</div>' + d.phrases.map(function(p){ return '<div class="stack2"><div class="xs">' + (p.source === 'you' ? 'From you' : 'From Claire') + '</div><div class="big">' + q(p.text) + '</div><div class="sm">' + esc(p.why) + '</div></div>'; }).join('') + '</div>';
  h += '<div class="card"><div class="label">One small fix</div><div class="stack2"><div class="xs">You said</div><div>' + esc(d.correction.youSaid) + '</div></div><div class="stack2"><div class="xs" style="font-weight:700;color:var(--ink)">Try saying</div><div class="big">' + esc(d.correction.trySaying) + '</div></div><div class="sm">' + esc(d.correction.why) + '</div></div>';
  h += '<div class="card"><div class="label">Follow-up questions you asked</div>' + (d.followUps.length ? '<div style="display:flex;flex-direction:column;gap:6px">' + d.followUps.map(function(x){ return '<div class="big">' + q(x) + '</div>'; }).join('') + '</div><div class="sm">Questions like these keep a chat going.</div>' : '<div>None this time. The tip below shows where one would fit.</div>') + '</div>';
  h += '<div class="card"><div class="label">Try next time</div><div>' + esc(d.nextTime) + '</div></div>';
  return h;
}

/* ---------- actions ---------- */
var ACT = {
  'intro-start': function(){ go('picker'); },
  pick: function(el){
    var id = el.getAttribute('data-scene'); ui.scene = id; markScene();
    scrollLock = Date.now() + 600; placeCarousel(ORDER.indexOf(id), true);
    if (id !== 'lift') toast('This scene is in the live version. The demo runs the hotel lift.');
  },
  start: function(){
    if (ui.scene !== 'lift') { ui.scene = 'lift'; markScene(); scrollLock = Date.now() + 600; placeCarousel(1, true); toast('Starting the hotel lift. The other scenes are in the live version.'); setTimeout(startChat, 900); return; }
    startChat();
  },
  history: function(){ toast(session ? 'Your chat is in the teacher view.' : 'Chats appear here after you practise. Finish the demo to see one.'); if (session) go('teacher'); },
  settings: function(){ openSheet('Settings', settingsHTML()); },
  'sheet-close': function(){ closeSheet(); },
  'set-hints': function(){ ui.hints = !ui.hints; openSheet('Settings', settingsHTML()); },
  'set-voice': function(){ ui.voiceOn = !ui.voiceOn; if (!ui.voiceOn) stopSpeak(); openSheet('Settings', settingsHTML()); },
  choose: function(el){ choose(el.getAttribute('data-k')); },
  back: function(){ var c = chat; if (!c || c.state !== 'check') return; c.draft = null; setState('yourturn'); armHint(); },
  send: function(){ sendReply(); },
  end: function(){
    var c = chat; if (!c) return;
    if (!c.picks.length) { teardown(); chat = null; go('picker'); return; }
    openSheet('End chat', '<div class="grab"></div><div class="shead"><h2>End this chat?</h2></div><div class="muted">You still get your tips for what you have said so far.</div><button type="button" class="btn btn-primary" data-act="end-now">End and see my tips</button><button type="button" class="btn btn-secondary" data-act="sheet-close">Keep chatting</button>');
  },
  'end-now': function(){ closeSheet(true); finishChat('early'); },
  teacher: function(){ go('teacher'); },
  debrief: function(){ go('debrief'); },
  again: function(){ startChat(); },
  home: function(){ go('picker'); }
};
document.addEventListener('click', function(e){
  var el = e.target.closest ? e.target.closest('[data-act]') : null;
  if (!el || el.disabled) return;
  var fn = ACT[el.getAttribute('data-act')];
  if (fn) fn(el, e);
});
document.addEventListener('keydown', function(e){ if (e.key === 'Escape' && ui.sheet) closeSheet(); });
document.addEventListener('visibilitychange', function(){ if (chat) chat.lastTick = performance.now(); });
try { if ('speechSynthesis' in window) window.speechSynthesis.getVoices(); } catch (e) {}
render();
})();
</script>
</body>
</html>
